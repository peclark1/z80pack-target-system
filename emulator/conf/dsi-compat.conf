# Digital Systems FDC-1 compatibility profile
#
# This profile is intentionally NOT the physical target memory map. It exists
# to boot historical DSI single-density systems that expect all 64K to be RAM,
# including 61K CP/M configurations that would overlap the target's F000-FFFF
# monitor ROM window.

# Reuse the target Console I/O V2 host-terminal backend. This is useful for
# archived images whose BIOS has been patched for the physical Console I/O
# board at ports 00H/01H.
sio1a_upper_case      0
sio1a_strip_parity    0
sio1a_drop_nulls      0
sio1a_baud_rate       0

# Keep the optional MIO backend configured consistently with the target.
sio2a_upper_case      0
sio2a_strip_parity    0
sio2a_drop_nulls      0
sio2a_baud_rate       19200

fp_port               00

# Historical DSI compatibility map: all 64K is RAM and execution begins at
# 0000H after TARGET_DSI_BOOTSTRAP loads track 0 sector 1 to 0000H-007FH.
[MEMORY 1]
ram         0x00,0x100
boot        0x0000
