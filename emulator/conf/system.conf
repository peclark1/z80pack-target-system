# IMSAI target-system z80pack configuration
#
# Memory is configured in 256-byte pages, matching z80pack's IMSAI memory
# configuration model.

# Reuse SIO1A as the host-terminal backend for the first Console I/O model.
# Baud 0 disables artificial serial pacing; the physical Console I/O board is
# not a baud-rate-limited serial interface.
sio1a_upper_case      0
sio1a_strip_parity    0
sio1a_drop_nulls      0
sio1a_baud_rate       0

# SIO2A is reserved as a convenient backend for the MIO SIO subset later.
sio2a_upper_case      0
sio2a_strip_parity    0
sio2a_drop_nulls      0
sio2a_baud_rate       19200

# When running without the graphical IMSAI front panel, IN FFH returns this
# byte. Low bits are SW09:SW08 and select the monitor console.
# 00 = Console I/O, 01 = Serial I/O A, 10 = MIO, 11 = reserved/fallback.
fp_port               00

# The target system uses exactly one CPU-visible 64K map:
#   0000-EFFF  60K RAM
#   F000-FFFF   4K ROM
# reset / North Star POJ enters at F000.
[MEMORY 1]
ram         0x00,0xF0
rom         0xF0,0x10,target-monitor.hex
boot        0xF000
