# Altair FDC+ Type 8 + Polymorphic VTI compatibility profile
#
# This is a dedicated alternate IMSAI operating mode, not the normal 60K/4K
# master-ROM configuration. It is intended to model a period-style floppy CP/M
# system using the Shugart SA-800-class drives and George Risk/VTI console.
#
# Address map:
#   0000H-FBFFH  63K contiguous RAM
#   FC00H-FFFFH   Polymorphic VTI 1K display RAM
#   FCH           VTI keyboard input port (high byte of FC00H)
#
# The physical VTI can jumper its keyboard interrupt output directly to any
# S-100 VI0-VI7 line. In this profile JMP2 uses VI2. The North Star ZPB's
# onboard vectored-interrupt logic responds to VI2 by supplying RST 2 during
# interrupt acknowledge, entering the keyboard ISR at 0010H. No PIC-8 is used.
#
# There is deliberately no ROM in this profile. During emulator development
# target-fdcplus-bootstrap loads the 51 relocated CP/M system sectors from
# FDC+ drive 0 at E200H-FB7FH, then execution starts at the 63K BIOS cold-boot
# entry F800H. A period-appropriate physical cold-start mechanism is a separate
# hardware integration question and must be solved before calling this mode a
# stand-alone physical boot configuration.

sio1a_upper_case      0
sio1a_strip_parity    0
sio1a_drop_nulls      0
sio1a_baud_rate       0

fp_port               00

[MEMORY 1]
ram         0x00,0xFC
boot        0xF800
