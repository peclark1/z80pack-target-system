# Altair FDC+ Type 8 + Polymorphic VTI compatibility profile
#
# This is a dedicated alternate IMSAI operating mode, not the normal 60K/4K
# master-ROM configuration. It models a period-style floppy CP/M system using
# the North Star ZPB-A2, FDC+ / Shugart SA-800-class drives, and George Risk /
# Polymorphic VTI console.
#
# Physical address map:
#   0000H-FBFFH  63K contiguous RAM
#   FC00H-FFFFH   Polymorphic VTI 1K display RAM
#   FCH           VTI keyboard input port (high byte of FC00H)
#
# The physical VTI can jumper its keyboard interrupt output directly to any
# S-100 VI0-VI7 line. In this profile JMP2 uses VI2. The North Star ZPB's
# onboard vectored-interrupt logic responds to VI2 by supplying RST 2 during
# interrupt acknowledge, entering the keyboard ISR at 0010H. No PIC-8 is used.
#
# CP/M is intentionally MOVCPM-sized as 62K even though 63K of ordinary RAM is
# physically present. CCP=DE00H, BDOS=E600H, BIOS=F400H. The standard 51-sector
# CP/M system image therefore still fits entirely in tracks 0-1 while the
# otherwise unused F780H-FBFFH RAM is available for BIOS runtime buffers below
# the VTI window. The custom BIOS contains its own FDC+3712 low-level driver, so
# no F400H controller PROM is required.
#
# During emulator development target-fdcplus-bootstrap performs only the job of
# a future front-panel first-stage loader: it copies the 51 CP/M system sectors
# from FDC+ drive 0 into DE00H-F77FH. Execution then starts at the custom BIOS
# cold-boot entry F400H. Once running, CP/M uses the normal emulated FDC+ at
# 08H/09H/0AH; the host loader is not used for ordinary disk I/O.

sio1a_upper_case      0
sio1a_strip_parity    0
sio1a_drop_nulls      0
sio1a_baud_rate       0

fp_port               00

[MEMORY 1]
ram         0x00,0xFC
boot        0xF400
