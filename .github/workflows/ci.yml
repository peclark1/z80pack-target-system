name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run host-side tests
        run: make test

  gui-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4/VTE test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-vte-3.91 \
            desktop-file-utils \
            xvfb \
            xauth
      - name: Construct GTK4/VTE application under Xvfb
        run: xvfb-run -a /usr/bin/python3 tools/run_gui_smoke.py
      - name: Test Ubuntu desktop installation
        run: |
          export HOME="$RUNNER_TEMP/gui-home"
          mkdir -p "$HOME"
          make gui-install
          test -x "$HOME/.local/bin/imsai-target-system"
          desktop-file-validate "$HOME/.local/share/applications/com.peclark.z80pack-target-system.desktop"
          make gui-uninstall

  targetsim-build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libx11-dev pasmo
      - name: Build targetsim and boot real target ROM through IDE
        run: make smoke
      - name: Exercise Polymorphic VTI video RAM and keyboard
        run: |
          python3 tools/make_vti_smoke.py build/smoke-vti.dsk
          python3 tools/run_vti_smoke.py \
            --targetsim build/z80pack-upstream/targets100sim/targetsim \
            --config build/z80pack-upstream/targets100sim/conf_3d/dsi-compat.conf \
            --disk build/smoke-vti.dsk \
            --screen build/smoke-vti-screen.bin \
            --keyboard build/smoke-vti-kbd
      - name: Exercise FDC+ Drive Type 8 FD3712 protocol
        run: |
          python3 tools/make_fdcplus_smoke.py \
            --disk build/smoke-fdcplus.dsk \
            --rom build/smoke-fdcplus-rom.bin
          rm -rf build/smoke-fdcplus-rom
          python3 tools/prepare_run_rom.py \
            build/smoke-fdcplus-rom.bin \
            build/smoke-fdcplus-rom
          python3 tools/run_fdcplus_smoke.py \
            --targetsim build/z80pack-upstream/targets100sim/targetsim \
            --config build/z80pack-upstream/targets100sim/conf_3d/system.conf \
            --romdir build/smoke-fdcplus-rom \
            --disk build/smoke-fdcplus.dsk
      - name: Stage runnable headless emulator
        run: |
          mkdir -p artifact
          cp build/z80pack-upstream/targets100sim/targetsim artifact/targetsim
          cp build/z80pack-upstream/targets100sim/conf_3d/system.conf artifact/system.conf
          cp build/target-monitor.hex artifact/target-monitor.hex
          chmod +x artifact/targetsim
      - name: Upload runnable targetsim
        uses: actions/upload-artifact@v4
        with:
          name: targetsim-headless
          path: artifact/
          if-no-files-found: error
