name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run host-side tests
        run: make test

  targetsim-build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libx11-dev pasmo
      - name: Build targetsim and boot real target ROM through IDE
        run: make smoke
      - name: Stage runnable headless emulator
        run: |
          mkdir -p artifact
          cp build/z80pack-upstream/targets100sim/targetsim artifact/targetsim
          cp build/z80pack-upstream/targets100sim/conf_3d/system.conf artifact/system.conf
          cp build/target-monitor.hex artifact/target-monitor.hex
          chmod +x artifact/targetsim
      - name: Upload runnable targetsim
        uses: actions/upload-artifact@v4
        with:
          name: targetsim-headless
          path: artifact/
          if-no-files-found: error
